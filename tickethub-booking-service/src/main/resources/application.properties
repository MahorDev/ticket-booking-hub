spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=${SERVER_PORT:8083}
spring.application.name=booking-service

# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tickethub_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useAffectedRows=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# RAZORPAY
# =========================================================
#razorpay.key-id=${RAZORPAY_KEY_ID:test_key_id}
#razorpay.key-secret=${RAZORPAY_KEY_SECRET:test_key_secret}
#razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:test_webhook_secret}

# =========================================================
# JPA
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# =========================================================
# DATABASE INITIALIZATION
# =========================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__create_booking_schema.sql
spring.sql.init.continue-on-error=false

# =========================================================
# EUREKA SERVICE DISCOVERY
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# =========================================================
# EVENT SERVICE
# =========================================================
# Keep this only if your Feign client still uses the URL.
# If you change to Eureka-based Feign, remove this property.
clients.event-service.url=${EVENT_SERVICE_URL:http://localhost:8081}

# =========================================================
# BOOKING CONFIGURATION
# =========================================================
booking.lock-minutes=5
booking.max-seats=6
booking.expiry-check-ms=10000

# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# =========================================================
# OPENFEIGN
# =========================================================
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.cloud.openfeign.circuitbreaker.enabled=false

# =========================================================
# KAFKA - BOOKING -> NOTIFICATION
# =========================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

spring.kafka.consumer.group-id=booking-saga-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# =========================================================
# NOTIFICATION
# =========================================================
notification.default-recipient=${NOTIFICATION_DEFAULT_RECIPIENT:}
notification.default-name=${NOTIFICATION_DEFAULT_NAME:TicketHub Customer}


# Resilience4j: bounded retries and circuit breakers for downstream dependencies.
resilience4j.circuitbreaker.instances.eventService.sliding-window-size=10
resilience4j.circuitbreaker.instances.eventService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.eventService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.eventService.wait-duration-in-open-state=10s
resilience4j.retry.instances.eventService.max-attempts=2
resilience4j.retry.instances.eventService.wait-duration=300ms

resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10s
resilience4j.retry.instances.paymentService.max-attempts=2
resilience4j.retry.instances.paymentService.wait-duration=300ms

management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

input {
  tcp {
    port => 5000
    codec => json_lines
    type => "microservice-logs"
  }
  beats {
    port => 5044
    codec => json
    type => "filebeat-logs"
  }
}

filter {
  if [type] == "microservice-logs" or [type] == "filebeat-logs" {
    # Ensure correlationId and traceId are indexed
    if ![correlation_id] and [correlationId] {
      mutate {
        add_field => { "correlation_id" => "%{correlationId}" }
      }
    }
    if ![correlation_id] and [mdc][correlationId] {
      mutate {
        add_field => { "correlation_id" => "%{[mdc][correlationId]}" }
      }
    }
    if ![trace_id] and [traceId] {
      mutate {
        add_field => { "trace_id" => "%{traceId}" }
      }
    }
    if ![span_id] and [spanId] {
      mutate {
        add_field => { "span_id" => "%{spanId}" }
      }
    }
    if ![service_name] and [appName] {
      mutate {
        add_field => { "service_name" => "%{appName}" }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "tickethub-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug { metadata => false }
  }
}
